[workspace]
resolver = "2"
members = ["crates/*"]
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sprs = { version = "=0.11.5", default-features = false }
sprs-ldl = "=0.10.0"
wasm-bindgen = "=0.2.128"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
